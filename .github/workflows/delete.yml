name: Bulk Delete Frame Files
on: workflow_dispatch
jobs:
  delete-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove WebP files and push
        run: |
          rm -f frame*.webp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bulk delete frame webp files" || echo "No changes to commit"
          git push
          
